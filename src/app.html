<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Blocking pre-paint theme: applies the cached mode + color vars before first
			// paint so dark/non-default themes never flash light. Cache written by
			// setGlobalColorTheme on every theme change.
			try {
				var t = JSON.parse(localStorage.getItem('heda-theme-v2') || 'null');
				if (t) {
					var el = document.documentElement;
					if (t.dark) {
						el.classList.add('dark');
						el.style.colorScheme = 'dark';
					}
					for (var k in t.vars) el.style.setProperty(k, t.vars[k]);
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
