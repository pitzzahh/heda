[package]
name = "heda-core"
version = "0.1.0"
description = "heda's calculation engine: PEC 2017 load schedules, voltage drop and short circuit."
edition = "2021"
rust-version = "1.82"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The JavaScript bindings the app loads (scripts/build-core.ts turns this on). Off by
# default, so the crate stays plain Rust for `cargo test` and for any native caller.
wasm = ["dep:wasm-bindgen"]

[dependencies]
# Legacy v1 file reader (`legacy_v1.rs`); goes with it.
base64 = "0.22.1"
hmac = "0.12.1"
krilla = { version = "0.8", default-features = false, features = ["comemo"] }
# The Excel exports (`workbook.rs`).
rust_xlsxwriter = { version = "0.103.0", default-features = false }
ryu-js = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.10.9", features = ["compress"] }
skrifa = "0.42"
svg = "0.18"
# Ids of the nodes an edit creates (`edit.rs`), as `crypto.randomUUID()` gave them.
uuid = { version = "1.29.3", features = ["v4"] }
# Exact pin: the generated bindings must come from wasm-bindgen-cli of the same version
# (scripts/build-core.ts checks it).
wasm-bindgen = { version = "=0.2.130", optional = true }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# The app's native builds compress the sheet set's pages in parallel; the WASM test build cannot.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
krilla = { version = "0.8", default-features = false, features = ["comemo", "rayon"] }

# Its creation timestamp reads the clock through js-sys there (SystemTime panics on wasm32).
[target.'cfg(target_arch = "wasm32")'.dependencies]
rust_xlsxwriter = { version = "0.103.0", default-features = false, features = ["wasm"] }
# Random ids come from the JS crypto API there (getrandom's `js` backend).
uuid = { version = "1.29.3", features = ["v4", "js"] }
