[package]
name = "heda-core"
version = "0.1.0"
description = "heda's calculation engine: PEC 2017 load schedules, voltage drop and short circuit."
edition = "2021"
rust-version = "1.82"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The JavaScript bindings the app loads (scripts/build-core.ts turns this on). Off by
# default, so the crate stays plain Rust for `cargo test` and for any native caller.
wasm = ["dep:wasm-bindgen"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Exact pin: the generated bindings must come from wasm-bindgen-cli of the same version
# (scripts/build-core.ts checks it).
wasm-bindgen = { version = "=0.2.130", optional = true }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
