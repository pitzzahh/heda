name: 'publish'

on:
  push:
    tags:
      - '*.*.*'
    # caches are scoped to the ref that saved them; tags can read main's, never another tag's
    branches:
      - main
    paths:
      - 'src-tauri/**'
      - '.github/workflows/publish.yml'
      - 'rust-toolchain.toml'

env:
  APP_NAME: 'Hierarchical Electrical Design Analyzer'

jobs:
  publish-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
            warm: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
            warm: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-latest' # deb and rpm bundles; the AppImage is skipped on purpose.
            args: '--bundles deb,rpm'
            warm: ''
          - platform: 'windows-latest'
            args: ''
            warm: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install npm globally
        run: bun install -g npm

      # pinned with rust-toolchain.toml: 1.100.0 linked WaitOnAddress to vertdll.dll on Windows
      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # both macOS targets run on one runner type and would otherwise share a key
          key: ${{ matrix.warm }}

      - name: Install frontend dependencies
        run: bun install

      - name: Warm the Rust cache
        if: github.ref_type == 'branch'
        run: bunx tauri build --no-bundle ${{ matrix.warm }}

      - name: Get Changelog Entry
        if: github.ref_type == 'tag'
        id: changelog_reader
        uses: mindsers/changelog-reader-action@v2
        with:
          validation_level: warn
          version: ${{ github.ref_name }}
          path: ./changelog.md

      - name: Build Tauri app and create release
        id: tauri
        uses: tauri-apps/tauri-action@v1
        if: ${{ github.ref_type == 'tag' }}
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_LEGACY_FILE_PASSPHRASE: ${{ secrets.VITE_LEGACY_FILE_PASSPHRASE }}
          VITE_LEGACY_FILE_SALT: ${{ secrets.VITE_LEGACY_FILE_SALT }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '${{ env.APP_NAME }} v${{ github.ref_name }}'
          releaseBody: ${{ steps.changelog_reader.outputs.changes }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # vertdll.dll is the VBS enclave runtime; its WaitOnAddress faults in a normal process,
      # so a binary importing it closes a few seconds after launch (0xC0000005)
      - name: Check the Windows binary's sync imports
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes('src-tauri/target/release/heda.exe')
          $text = [Text.Encoding]::ASCII.GetString($bytes)
          if ($text.Contains('vertdll.dll')) { throw 'heda.exe imports vertdll.dll and will crash on launch' }
          if (-not $text.Contains('api-ms-win-core-synch-l1-2-0.dll')) { throw 'heda.exe has no core sync imports' }
          'heda.exe imports WaitOnAddress from the core sync API set'

      - name: Package Linux tarball
        if: matrix.platform == 'ubuntu-latest' && github.ref_type == 'tag'
        run: |
          PKG=src-tauri/target/release/pkg
          mkdir -p "$PKG"
          install -m 755 src-tauri/target/release/heda "$PKG/heda"
          cp src-tauri/icons/icon.png "$PKG/heda.png"
          tee "$PKG/heda.desktop" <<'EOF'
          [Desktop Entry]
          Name=Hierarchical Electrical Design Analyzer
          Comment=Load schedules, voltage drop and short circuit analysis
          Exec=heda %f
          Icon=heda
          MimeType=application/x-heda;
          Terminal=false
          Type=Application
          Categories=Utility;
          EOF
          cp src-tauri/linux/heda.xml "$PKG/heda.xml"
          tar -czf "Hierarchical_Electrical_Design_Analyzer-${{ github.ref_name }}-linux-x86_64.tar.gz" -C "$PKG" heda heda.png heda.desktop heda.xml
          ls -lh Hierarchical_Electrical_Design_Analyzer-*.tar.gz

      - name: Upload Linux tarball and updater binary to release
        if: matrix.platform == 'ubuntu-latest' && github.ref_type == 'tag'
        # by id: tag lookups skip drafts, so a tag-based upload creates a second public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TARBALL: Hierarchical_Electrical_Design_Analyzer-${{ github.ref_name }}-linux-x86_64.tar.gz
          BIN: heda-${{ github.ref_name }}-linux-x86_64
          UPLOAD: https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.tauri.outputs.releaseId }}/assets
        run: |
          # the updater installs a plain binary only when it carries no deb/rpm bundle mark
          grep -aq __TAURI_BUNDLE_TYPE_VAR_UNK src-tauri/target/release/pkg/heda
          cp src-tauri/target/release/pkg/heda "$BIN"
          bunx tauri signer sign "$BIN"
          gh api -X POST -H 'Content-Type: application/gzip' --input "$TARBALL" "$UPLOAD?name=$TARBALL"
          gh api -X POST -H 'Content-Type: application/octet-stream' --input "$BIN" "$UPLOAD?name=$BIN"
          gh api -X POST -H 'Content-Type: text/plain' --input "$BIN.sig" "$UPLOAD?name=$BIN.sig"

  # tauri-action points the generic linux-x86_64 entry at the .deb, which overwrites tarball
  # installs with a package; point it at the signed plain binary once every job has written latest.json
  linux-updater-entry:
    needs: publish-desktop
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Point linux-x86_64 at the plain binary
        run: |
          ID=$(gh api "repos/$R/releases" --jq "[.[] | select(.tag_name == \"$TAG\")][0].id")
          asset() { gh api "repos/$R/releases/$ID/assets" --jq ".[] | select(.name == \"$1\") | .id"; }
          BIN="heda-$TAG-linux-x86_64"
          JSON_ID=$(asset latest.json)
          gh api -H 'Accept: application/octet-stream' "repos/$R/releases/assets/$JSON_ID" > latest.json
          gh api -H 'Accept: application/octet-stream' "repos/$R/releases/assets/$(asset "$BIN.sig")" > bin.sig
          jq --rawfile sig bin.sig --arg url "https://github.com/$R/releases/download/$TAG/$BIN" \
            '.platforms["linux-x86_64"] = {signature: $sig, url: $url}' latest.json > latest.new.json
          jq -e '.platforms["linux-x86_64"].url | endswith("linux-x86_64")' latest.new.json
          gh api -X DELETE "repos/$R/releases/assets/$JSON_ID"
          gh api -X POST -H 'Content-Type: application/json' --input latest.new.json \
            "https://uploads.github.com/repos/$R/releases/$ID/assets?name=latest.json"
