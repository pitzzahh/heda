name: 'publish'

on:
  push:
    tags:
      - '*.*.*'

env:
  APP_NAME: 'Hierarchical Electrical Design Analyzer'

jobs:
  publish-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-latest' # deb and rpm bundles; the AppImage is skipped on purpose.
            args: '--bundles deb,rpm'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install npm globally
        run: bun install -g npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install

      - name: Get Changelog Entry
        id: changelog_reader
        uses: mindsers/changelog-reader-action@v2
        with:
          validation_level: warn
          version: ${{ github.ref_name }}
          path: ./changelog.md

      - name: Build Tauri app and create release
        uses: tauri-apps/tauri-action@v1
        if: ${{ github.ref_type == 'tag' }}
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '${{ env.APP_NAME }} v${{ github.ref_name }}'
          releaseBody: ${{ steps.changelog_reader.outputs.changes }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Package Linux tarball
        if: matrix.platform == 'ubuntu-latest'
        run: |
          PKG=src-tauri/target/release/pkg
          mkdir -p "$PKG"
          install -m 755 src-tauri/target/release/heda "$PKG/heda"
          cp src-tauri/icons/icon.png "$PKG/heda.png"
          tee "$PKG/heda.desktop" <<'EOF'
          [Desktop Entry]
          Name=Hierarchical Electrical Design Analyzer
          Comment=Load schedules, voltage drop and short circuit analysis
          Exec=heda
          Icon=heda
          Terminal=false
          Type=Application
          Categories=Utility;
          EOF
          tar -czf "Hierarchical_Electrical_Design_Analyzer-${{ github.ref_name }}-linux-x86_64.tar.gz" -C "$PKG" heda heda.png heda.desktop
          ls -lh Hierarchical_Electrical_Design_Analyzer-*.tar.gz

      - name: Upload Linux tarball to release
        if: matrix.platform == 'ubuntu-latest'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: Hierarchical_Electrical_Design_Analyzer-${{ github.ref_name }}-linux-x86_64.tar.gz
          tag: ${{ github.ref }}
          overwrite: true
