name: 'publish'

# releases run on branches, not on tag pushes: a tag run can read the default branch's caches but never the previous tag's.
# preview (the default branch) ships pre-releases like 2.9.0-1; main ships stable versions like 2.9.0.
on:
  push:
    branches:
      - main
      - preview
    paths:
      - 'src-tauri/tauri.conf.json'
  workflow_dispatch:

env:
  APP_NAME: 'Hierarchical Electrical Design Analyzer'

jobs:
  # every later job is skipped unless tauri.conf.json carries a version with no tag or release yet,
  # in the form its branch ships
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # draft releases are only listed for tokens with push access
    outputs:
      version: ${{ steps.ver.outputs.version }}
      new: ${{ steps.ver.outputs.new }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the version and check it is unreleased
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R: ${{ github.repository }}
        run: |
          V=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # the Windows MSI accepts only a numeric pre-release part, so previews are 2.9.0-1, not 2.9.0-beta.1
          case "$GITHUB_REF_NAME" in
            preview) FORM='^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$'; PRE=true ;;
            main) FORM='^[0-9]+\.[0-9]+\.[0-9]+$'; PRE=false ;;
            *) FORM='^$'; PRE=false ;;
          esac
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          if ! grep -qE "$FORM" <<< "$V"; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$V is not a $GITHUB_REF_NAME version (preview: 2.9.0-1, main: 2.9.0); skipping"
          # drafts have no git tag yet, so check releases too
          elif git ls-remote --exit-code --tags origin "refs/tags/$V" >/dev/null \
            || gh api --paginate "repos/$R/releases" --jq '.[].tag_name' | grep -qxF "$V"; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$V already has a tag or release; skipping"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  publish-desktop:
    needs: version
    if: needs.version.outputs.new == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-24.04' # pinned: older glibc for the deb, rpm and tarball; the AppImage is skipped on purpose.
            args: '--bundles deb,rpm'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install npm globally
        run: bun install -g npm

      # pinned with rust-toolchain.toml: 1.100.0 linked WaitOnAddress to vertdll.dll on Windows
      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # both macOS targets run on one runner type and would otherwise share a key
          key: ${{ matrix.args }}

      - name: Install frontend dependencies
        run: bun install

      - name: Get Changelog Entry
        id: changelog_reader
        uses: mindsers/changelog-reader-action@v2
        with:
          validation_level: warn
          # only the entry being released; older ones predate the section rules
          validation_depth: 1
          version: ${{ needs.version.outputs.version }}
          path: ./changelog.md

      - name: Build Tauri app and create release
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_LEGACY_FILE_PASSPHRASE: ${{ secrets.VITE_LEGACY_FILE_PASSPHRASE }}
          VITE_LEGACY_FILE_SALT: ${{ secrets.VITE_LEGACY_FILE_SALT }}
        with:
          tagName: ${{ needs.version.outputs.version }}
          releaseCommitish: ${{ github.sha }}
          releaseName: '${{ env.APP_NAME }} v${{ needs.version.outputs.version }}'
          releaseBody: ${{ steps.changelog_reader.outputs.changes }}
          releaseDraft: true
          # GitHub never serves a pre-release as "latest", so the updater keeps stable installs on stable
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          args: ${{ matrix.args }}

      # vertdll.dll is the VBS enclave runtime; its WaitOnAddress faults in a normal process,
      # so a binary importing it closes a few seconds after launch (0xC0000005)
      - name: Check the Windows binary's sync imports
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes('src-tauri/target/release/heda.exe')
          $text = [Text.Encoding]::ASCII.GetString($bytes)
          if ($text.Contains('vertdll.dll')) { throw 'heda.exe imports vertdll.dll and will crash on launch' }
          if (-not $text.Contains('api-ms-win-core-synch-l1-2-0.dll')) { throw 'heda.exe has no core sync imports' }
          'heda.exe imports WaitOnAddress from the core sync API set'

      - name: Package Linux tarball
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          PKG=src-tauri/target/release/pkg
          mkdir -p "$PKG"
          install -m 755 src-tauri/target/release/heda "$PKG/heda"
          cp src-tauri/icons/icon.png "$PKG/heda.png"
          tee "$PKG/heda.desktop" <<'EOF'
          [Desktop Entry]
          Name=Hierarchical Electrical Design Analyzer
          Comment=Load schedules, voltage drop and short circuit analysis
          Exec=heda %f
          Icon=heda
          MimeType=application/x-heda;
          Terminal=false
          Type=Application
          Categories=Utility;
          EOF
          cp src-tauri/linux/heda.xml "$PKG/heda.xml"
          tar -czf "Hierarchical_Electrical_Design_Analyzer-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz" -C "$PKG" heda heda.png heda.desktop heda.xml
          ls -lh Hierarchical_Electrical_Design_Analyzer-*.tar.gz

      - name: Upload Linux tarball and updater binary to release
        if: matrix.platform == 'ubuntu-24.04'
        # by id: tag lookups skip drafts, so a tag-based upload creates a second public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TARBALL: Hierarchical_Electrical_Design_Analyzer-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
          BIN: heda-${{ needs.version.outputs.version }}-linux-x86_64
          UPLOAD: https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.tauri.outputs.releaseId }}/assets
        run: |
          # the updater installs a plain binary only when it carries no deb/rpm bundle mark
          grep -aq __TAURI_BUNDLE_TYPE_VAR_UNK src-tauri/target/release/pkg/heda
          cp src-tauri/target/release/pkg/heda "$BIN"
          bunx tauri signer sign "$BIN"
          gh api -X POST -H 'Content-Type: application/gzip' --input "$TARBALL" "$UPLOAD?name=$TARBALL"
          gh api -X POST -H 'Content-Type: application/octet-stream' --input "$BIN" "$UPLOAD?name=$BIN"
          gh api -X POST -H 'Content-Type: text/plain' --input "$BIN.sig" "$UPLOAD?name=$BIN.sig"

  # The APK goes on the draft release tauri-action created; Android has no in-app updater.
  publish-android:
    needs: [version, publish-desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.version }}
      NDK_VERSION: '29.0.14206865'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # caches the Gradle wrapper, dependencies and the build cache between runs
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # the default also installs the legacy `tools` package, which cmdline-tools 16 can no longer resolve
          packages: 'platform-tools'

      - name: Install the Android platform, build tools and NDK
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: 'aarch64-linux-android,armv7-linux-androideabi'

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: android

      - name: Install frontend dependencies
        run: bun install

      - name: Write the release keystore
        # the 2025 release key: KEYSTORE is the base64 .jks, KEY its alias
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE" | base64 -d > "$KS"
          printf 'storeFile=%s\npassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > src-tauri/gen/android/keystore.properties

      - name: Build the APK
        env:
          CI: true
          VITE_LEGACY_FILE_PASSPHRASE: ${{ secrets.VITE_LEGACY_FILE_PASSPHRASE }}
          VITE_LEGACY_FILE_SALT: ${{ secrets.VITE_LEGACY_FILE_SALT }}
        run: bunx tauri android build --apk --target aarch64 armv7

      - name: Upload the APK to the release
        run: |
          APK=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          # an unsigned build means the keystore secrets are missing; never publish one
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$APK"
          NAME="Hierarchical_Electrical_Design_Analyzer-$TAG-android.apk"
          ID=$(gh api "repos/$R/releases" --jq "[.[] | select(.tag_name == \"$TAG\")][0].id")
          gh api -X POST -H 'Content-Type: application/vnd.android.package-archive' --input "$APK" \
            "https://uploads.github.com/repos/$R/releases/$ID/assets?name=$NAME"

  # tauri-action points the generic linux-x86_64 entry at the .deb, which overwrites tarball
  # installs with a package; point it at the signed plain binary once every job has written latest.json
  linux-updater-entry:
    needs: [version, publish-desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.version }}
    steps:
      - name: Point linux-x86_64 at the plain binary
        run: |
          ID=$(gh api "repos/$R/releases" --jq "[.[] | select(.tag_name == \"$TAG\")][0].id")
          asset() { gh api "repos/$R/releases/$ID/assets" --jq ".[] | select(.name == \"$1\") | .id"; }
          BIN="heda-$TAG-linux-x86_64"
          JSON_ID=$(asset latest.json)
          gh api -H 'Accept: application/octet-stream' "repos/$R/releases/assets/$JSON_ID" > latest.json
          gh api -H 'Accept: application/octet-stream' "repos/$R/releases/assets/$(asset "$BIN.sig")" > bin.sig
          jq --rawfile sig bin.sig --arg url "https://github.com/$R/releases/download/$TAG/$BIN" \
            '.platforms["linux-x86_64"] = {signature: $sig, url: $url}' latest.json > latest.new.json
          jq -e '.platforms["linux-x86_64"].url | endswith("linux-x86_64")' latest.new.json
          gh api -X DELETE "repos/$R/releases/assets/$JSON_ID"
          gh api -X POST -H 'Content-Type: application/json' --input latest.new.json \
            "https://uploads.github.com/repos/$R/releases/$ID/assets?name=latest.json"

  # previews go out on their own once every asset is up; stable drafts are still published by hand
  publish-preview:
    needs: [version, publish-desktop, publish-android, linux-updater-entry]
    if: needs.version.outputs.prerelease == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.version }}
    steps:
      - name: Publish the pre-release
        run: |
          ID=$(gh api "repos/$R/releases" --jq "[.[] | select(.tag_name == \"$TAG\")][0].id")
          gh api -X PATCH "repos/$R/releases/$ID" -F draft=false -F prerelease=true -f make_latest=false \
            --jq '"published \(.tag_name): \(.html_url)"'
